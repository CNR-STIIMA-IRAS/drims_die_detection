die_detector_node:
  ros__parameters:
    # ── Pose method ──────────────────────────────────────────────────────
    # silhouette : YOLOE mask -> cube-silhouette fit + CNN top/front (recommended)
    # yoloe_faces: YOLOE mask -> original face/pip segmentation + top-face-polygon pose
    # classical  : RANSAC depth plane + HSV face/pip segmentation
    pose_method: silhouette
    device: auto                  # YOLOE + CNN: auto | cuda | cpu
    cnn_model_path: weights/die_mobilenet_v3.pt
    cnn_conf_thresh: 0.55
    min_fit_iou: 0.85             # reject poses whose silhouette IoU is lower (occlusion, wrong object)
    accept_fit_iou: 0.90          # stop trying YOLOE candidates once one fits this well
    min_face_pose_iou: 0.60       # yoloe_faces: same check on the face-polygon pose (not IoU-optimised)
    max_yoloe_candidates: 3
    yoloe_candidate_conf: 0.02
    color_fallback: true          # HSV candidate when no YOLOE candidate fits
    # Table plane for the silhouette method: tf | fixed | depth
    plane_source: tf
    table_frame: base_footprint
    table_height_m: 0.55          # tiago_utils_config.yaml: table_pos_z + leg_height + table_thickness
    # plane_source: fixed -> plane in the camera optical frame (n up, n·X + h = 0)
    plane_normal_cam: [0.0, -0.6, -0.8]
    plane_height_m: 0.62

    canny_high_thresh: 130
    canny_low_thresh: 40
    # camera_info_topic: /camera/color/camera_info
    camera_info_topic: /head_front_camera/color/camera_info
    clahe_clip_limit: 6.0
    debug: true
    debug_panels_topic: /dice/debug_panels
    depth_model: Intel/dpt-hybrid-midas
    depth_scale: 0.001
    # depth_topic: /camera/aligned_depth_to_color/image_raw
    depth_topic: /head_front_camera/aligned_depth_to_color/image_raw
    detection_mode: hsv   # classical path only (was 'km', which matched no mode and ran HSV)
    die_color: white
    die_size_m: 0.041
    fx: 615.0
    fy: 615.0
    glare_v_thresh: 150 
    hsv_max:
    - 105
    - 55
    - 255
    hsv_min:
    - 80
    - 0
    - 94
    max_die_height_m: 0.1 #0.065
    max_pips: 6
    min_die_height_m: 0.003
    min_pips: 1
    num_color_clusters: 5
    output_dir: output
    pip_min_circularity: 0.65
    pose_topic: /dice/pose
    ransac_distance_threshold: 0.015
    ransac_max_iterations: 1000
    # rgb_topic: /camera/color/image_raw
    rgb_topic: /head_front_camera/color/image_raw
    save: true
    service_name: die_identification_3d
    top_down_topic: /dice/top_down
    use_monocular_fallback: true
    visualize: true

rgbd_mock_publisher:
  ros__parameters:
    # frame_id: camera_color_optical_frame
    frame_id: head_front_camera_color_optical_frame
    # rgb_topic: /camera/color/image_raw
    rgb_topic: /head_front_camera/color/image_raw
    # depth_topic: /camera/aligned_depth_to_color/image_raw
    depth_topic: /head_front_camera/aligned_depth_to_color/image_raw
    # camera_info_topic: /camera/color/camera_info
    camera_info_topic: /head_front_camera/color/camera_info
    # points_topic: /camera/depth/color/points
    points_topic: /head_front_camera/depth/color/points
    publish_rate: 2.0

